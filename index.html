<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Acesso restrito · Tailor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500&display=swap">
<style>
:root { --bg: #FFFFFF; --ink: #000000; --muted: #666666; --line: #999999; --green: #90F208; --green-hover: #7FD909; --focus: rgba(144,242,8,.45); --bad: #FF0040; --bad-tint: #FFE0E8 }
@media (prefers-color-scheme: dark) { :root { --bg: #000000; --ink: #FFFFFF; --muted: #CFCFCF; --line: #4D4D4D; --bad-tint: rgba(255,0,64,.18); color-scheme: dark } }
* { box-sizing: border-box; border-radius: 0 }
html, body { margin: 0; height: 100% }
[hidden] { display: none !important }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.55 "Raleway", "Roboto", system-ui, sans-serif; display: grid; place-items: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px }
main { width: min(100%, 400px); display: grid; gap: 24px }
.ov { font: 500 11px/1.2 "Raleway", sans-serif; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); display: flex; gap: 8px; align-items: center }
.ov::before { content: ""; width: 8px; height: 8px; background: var(--green) }
h1 { font: 500 26px/1.15 "Raleway", sans-serif; text-transform: uppercase; margin: 0 }
p { margin: 0; color: var(--muted) }
form { display: grid; gap: 16px }
label { display: grid; gap: 8px; font: 500 13px/1.2 "Raleway", sans-serif }
input { font: 400 16px "Raleway", sans-serif; color: var(--ink); background: var(--bg); border: 1px solid var(--line); min-height: 44px; padding: 10px 14px; width: 100% }
input:focus-visible { outline: none; border-color: var(--ink); box-shadow: 0 0 0 3px var(--focus) }
button { font: 500 14px "Raleway", sans-serif; min-height: 44px; border: 0; background: var(--green); color: #000; cursor: pointer }
button:hover { background: var(--green-hover) }
button:focus-visible { outline: 2px solid var(--ink); box-shadow: 0 0 0 5px var(--focus) }
button[disabled] { opacity: .45; cursor: wait }
.err { padding: 10px 14px; background: var(--bad-tint); border-left: 3px solid var(--bad); font-size: 13px; color: var(--ink) }
small { color: var(--muted); font-size: 12px }
</style>
</head>

    <button id="go" type="submit">Abrir proposta</button>
